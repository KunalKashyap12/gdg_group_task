version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: crop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crop_disease_db
      POSTGRES_USER: crop_app
      POSTGRES_PASSWORD: crop_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crop_app -d crop_disease_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crop-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/crop_disease_db
      DATABASE_USERNAME: crop_app
      DATABASE_PASSWORD: crop_password
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_TOKEN_INFO_URL: ${GOOGLE_TOKEN_INFO_URL:-https://oauth2.googleapis.com/tokeninfo}
      ML_BASE_URL: ${ML_BASE_URL:-http://localhost:8000}
      ML_MOCK_FALLBACK: "true"
      MIN_PREDICTION_CONFIDENCE: "0.70"
    env_file:
      - .env

volumes:
  postgres_data:
    driver: local
