spring.application.name=crop-disease-backend-test

# Use in-memory H2 database for testing
spring.datasource.url=jdbc:h2:mem:crop_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT test secret
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=3600000

# Google Authentication (test defaults)
app.google.client-id=test-google-client-id.apps.googleusercontent.com
app.google.token-info-url=https://oauth2.googleapis.com/tokeninfo
app.google.connect-timeout-ms=1000
app.google.read-timeout-ms=2000

# ML service mock for testing
app.ml.base-url=http://localhost:8000
app.ml.predict-path=/predict
app.ml.connect-timeout-ms=1000
app.ml.read-timeout-ms=2000
app.ml.mock-fallback=true

app.prediction.minimum-confidence=0.70
app.guidance.general=Inspect plants regularly.|Avoid unnecessary wetting of leaves.|Handle affected plant material appropriately.|Seek confirmation from a local agricultural expert.
