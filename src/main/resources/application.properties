spring.application.name=crop-disease-backend
server.port=${PORT:${SERVER_PORT:8080}}

# Database (PostgreSQL by default, configurable via env)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/crop_disease_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:qwerty0816}

# JPA / Hibernate  
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Image upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://frontend-ux-grptask.vercel.app,https://teamtask-frontend-sigma.vercel.app,http://localhost:3000,http://localhost:5173}

# JWT Authentication
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Google Authentication
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.token-info-url=${GOOGLE_TOKEN_INFO_URL:https://oauth2.googleapis.com/tokeninfo}
app.google.connect-timeout-ms=${GOOGLE_CONNECT_TIMEOUT_MS:3000}
app.google.read-timeout-ms=${GOOGLE_READ_TIMEOUT_MS:5000}

# Live ML Microservice Integration (FloraScan AI / Render)
ml.service.url=${ML_SERVICE_URL:https://gdg-grp-task-ml-2.onrender.com}
ml.service.timeout-ms=${ML_TIMEOUT_MS:30000}

# ML service fallback and connection properties
app.ml.base-url=${ML_SERVICE_URL:${ML_BASE_URL:https://gdg-grp-task-ml-2.onrender.com}}
app.ml.predict-path=${ML_PREDICT_PATH:/api/v1/predict}
app.ml.connect-timeout-ms=${ML_CONNECT_TIMEOUT_MS:30000}
app.ml.read-timeout-ms=${ML_READ_TIMEOUT_MS:30000}
app.ml.mock-fallback=${ML_MOCK_FALLBACK:true}

# Prediction settings
app.prediction.minimum-confidence=${MIN_PREDICTION_CONFIDENCE:0.70}

# General non-prescriptive preventive guidance
app.guidance.general=Inspect plants regularly and monitor changes in leaf appearance.|Avoid unnecessary wetting of leaves when watering.|Handle affected plant material appropriately.|Seek confirmation from a local agricultural expert if symptoms persist.

# Email & OTP Mail Service Configuration (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App Mail Settings
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:${spring.mail.username:}}
app.mail.sender-name=${MAIL_SENDER_NAME:FloraScan Support}
app.otp.mock-response=${OTP_MOCK_RESPONSE:true}

