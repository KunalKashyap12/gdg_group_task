spring.application.name=backend

spring.application.name=crop-disease-backend
server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/crop_disease_db}
spring.datasource.username=${DATABASE_USERNAME:crop_app}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Image upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Python ML service
app.ml.base-url=${ML_BASE_URL:http://localhost:8000}
app.ml.predict-path=${ML_PREDICT_PATH:/predict}
app.ml.connect-timeout-ms=${ML_CONNECT_TIMEOUT_MS:3000}
app.ml.read-timeout-ms=${ML_READ_TIMEOUT_MS:15000}

# Low-confidence threshold
app.prediction.minimum-confidence=${MIN_PREDICTION_CONFIDENCE:0.70}

# General, non-disease-specific guidance
app.guidance.general=Inspect plants regularly and monitor changes in leaf appearance.|Avoid unnecessary wetting of leaves when watering.|Handle affected plant material appropriately.|Seek confirmation from a local agricultural expert if symptoms persist.
