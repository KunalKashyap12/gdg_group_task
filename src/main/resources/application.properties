spring.application.name=crop-disease-backend
server.port=${PORT:${SERVER_PORT:8080}}

# Database (PostgreSQL by default, configurable via env)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/crop_disease_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Image upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JWT Authentication
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Google Authentication
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.token-info-url=${GOOGLE_TOKEN_INFO_URL:https://oauth2.googleapis.com/tokeninfo}
app.google.connect-timeout-ms=${GOOGLE_CONNECT_TIMEOUT_MS:3000}
app.google.read-timeout-ms=${GOOGLE_READ_TIMEOUT_MS:5000}

# Live ML Microservice Integration (FloraScan AI / Render)
ml.service.url=${ML_SERVICE_URL:https://gdg-grp-task-ml-2.onrender.com}
ml.service.timeout-ms=${ML_TIMEOUT_MS:30000}

# ML service fallback and connection properties
app.ml.base-url=${ML_SERVICE_URL:${ML_BASE_URL:https://gdg-grp-task-ml-2.onrender.com}}
app.ml.predict-path=${ML_PREDICT_PATH:/api/v1/predict}
app.ml.connect-timeout-ms=${ML_CONNECT_TIMEOUT_MS:30000}
app.ml.read-timeout-ms=${ML_READ_TIMEOUT_MS:30000}
app.ml.mock-fallback=${ML_MOCK_FALLBACK:true}

# Prediction settings
app.prediction.minimum-confidence=${MIN_PREDICTION_CONFIDENCE:0.70}

# General non-prescriptive preventive guidance
app.guidance.general=Inspect plants regularly and monitor changes in leaf appearance.|Avoid unnecessary wetting of leaves when watering.|Handle affected plant material appropriately.|Seek confirmation from a local agricultural expert if symptoms persist.
